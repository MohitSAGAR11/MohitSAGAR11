<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 128" width="292" height="128" role="img" aria-label="Portfolio: mohitsagar11.github.io">
<title>Portfolio: mohitsagar11.github.io</title>
<style>
@font-face{font-family:D;src:url(data:font/woff;base64,) format("woff")}
.fd{font-family:D,"Arial Narrow",Impact,sans-serif}
@font-face{font-family:M;src:url(data:font/woff;base64,) format("woff")}
.fm{font-family:M,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

.a{transform-box:fill-box;transform-origin:50% 50%}
.ab{transform-box:fill-box;transform-origin:50% 100%}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes twinkle{50%{opacity:.06}}
.still{display:none}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.smil{display:none}
.still{display:inline}
.typed{clip-path:none!important}
}
@keyframes rise0{from{transform:translateY(46px)}}
</style>
<defs><clipPath id="rise0"><rect x="16" y="46.4" width="202.5" height="43.6"/></clipPath></defs>
<rect x=".5" y=".5" width="291" height="127" rx="14" fill="#0f0e0c" stroke="#2a2824" style="animation:fade 0.5s cubic-bezier(.16,1,.3,1) 0.55s both"/>
<text class="fm" x="20.0" y="32.0" font-size="11.0" fill="#8f897e" letter-spacing="0.88" style="animation:up 0.9s cubic-bezier(.16,1,.3,1) 0.65s both">01 / WEBSITE</text>
<path d="M258,33 L271,20 M261.9,20 H271 V29.1" pathLength="1" fill="none" stroke="#ffb000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1" style="animation:draw .6s cubic-bezier(.16,1,.3,1) 1.05s both"/>
<g clip-path="url(#rise0)"><text class="fd" x="20.0" y="84.0" font-size="46.0" fill="#ece8df" style="animation:rise0 1.0s cubic-bezier(.16,1,.3,1) 0.7s both">PORTFOLIO</text></g>
<text class="fm" x="20.0" y="108.0" font-size="11.5" fill="#8f897e" style="animation:up 0.9s cubic-bezier(.16,1,.3,1) 0.9s both">mohitsagar11.github.io</text>
