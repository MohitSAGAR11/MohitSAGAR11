name: Refresh Contribution Scan

# Re-renders assets/contrib-dark.svg and assets/contrib-light.svg from the
# contribution calendar and saves the calendar to data/contributions.json.
# Logic lives in .github/scripts/contribution-scan.js.
# Then renders the README's SVG cards into cards/ from that JSON with
# .github/scripts/render_cards.py.
# Replaced the Platane/snk snake; its old `output` branch is no longer read.
#
# Secrets: none required. Uses the built-in GITHUB_TOKEN.

on:
  schedule:
    - cron: "0 0 * * *"   # daily 00:00 UTC — first of the three README jobs
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/contribution-scan.js
      - .github/scripts/render_cards.py
      - .github/cards/**
      - .github/workflows/contribution-scan.yml

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Render contribution scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Render SVGs
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const run = require('./.github/scripts/contribution-scan.js');
            await run({ github, core });

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Render cards
        run: |
          pip install --quiet fonttools==4.60.1
          python .github/scripts/render_cards.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-dark.svg assets/contrib-light.svg data/contributions.json cards
          git diff --cached --quiet || git commit -m "chore: refresh contribution scan and cards [skip ci]"
          git pull --rebase --quiet && git push   # another README job may have pushed first
