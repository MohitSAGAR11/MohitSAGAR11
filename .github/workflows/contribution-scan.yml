name: Refresh Contribution Scan

# Re-renders assets/contrib-dark.svg and assets/contrib-light.svg from the
# contribution calendar. Logic lives in .github/scripts/contribution-scan.js.
# Replaced the Platane/snk snake; its old `output` branch is no longer read.
#
# Secrets: none required. Uses the built-in GITHUB_TOKEN.

on:
  schedule:
    - cron: "0 0 * * *"   # daily 00:00 UTC — first of the three README jobs
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/contribution-scan.js
      - .github/workflows/contribution-scan.yml

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Render contribution scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render SVGs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const run = require('./.github/scripts/contribution-scan.js');
            await run({ github, core });

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-dark.svg assets/contrib-light.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution scan [skip ci]"
          git push
