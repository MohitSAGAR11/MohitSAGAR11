name: Refresh Profile Stats

on:
  schedule:
    - cron: "0 2 * * *"   # runs daily at 02:00 UTC (offset from snake workflow)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    name: Update profile README stats cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh README timestamp (keeps GitHub stats CDN fresh)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch .github/.last-refreshed
          echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > .github/.last-refreshed
          git add .github/.last-refreshed
          git diff --cached --quiet || git commit -m "chore: refresh profile stats [skip ci]"
          git push
