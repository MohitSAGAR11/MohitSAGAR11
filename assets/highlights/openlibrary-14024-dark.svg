<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 156" width="440" height="156" role="img" aria-label="openlibrary #14024, merged: match authors regardless of name order. Before: &quot;Sagar, Mohit&quot; ≠ &quot;Mohit Sagar&quot; → duplicate edition. After: compare both name orders → existing edition reused.">
  <title>openlibrary #14024 — match authors regardless of name order</title>
  <style>
