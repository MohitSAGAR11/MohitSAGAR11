<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Mohit Sagar — Computer Science Engineer, Backend Developer, AI/ML Engineer">
  <title>Mohit Sagar — Backend · AI/ML · System Design</title>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B4690E" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#B4690E" stop-opacity="0"/>
    </radialGradient>

    <!-- typing reveal masks: a white rect whose width animates from 0 to the
         full string width, wiping the text into view left-to-right -->
    <mask id="mA" maskUnits="userSpaceOnUse">
      <rect x="62" y="206" height="26" width="0" fill="#ffffff">
        <animate attributeName="width"
                 values="0;324;324;0;0;0"
                 keyTimes="0;0.2308;0.4231;0.5;0.9231;1"
                 dur="13s" repeatCount="indefinite"/>
      </rect>
    </mask>
    <mask id="mB" maskUnits="userSpaceOnUse">
      <rect x="62" y="206" height="26" width="0" fill="#ffffff">
        <animate attributeName="width"
                 values="0;0;0;378;378;0"
                 keyTimes="0;0.4231;0.5;0.7308;0.9231;1"
                 dur="13s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <!-- ─────────── left column: type ─────────── -->

  <text x="42" y="54" fill="#B4690E" font-size="11" letter-spacing="2.6" font-weight="600"
        font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace">COMPUTER SCIENCE ENGINEER · BACKEND · AI/ML</text>

  <text x="42" y="116" fill="#1F2328" font-size="52" letter-spacing="4" font-weight="700"
        font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace">MOHIT SAGAR</text>

  <!-- accent rule, drawn in on load -->
  <line x1="42" y1="134" x2="429" y2="134" stroke="#B4690E" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="387" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="387" to="0" dur="1.1s" begin="0.15s" fill="freeze"/>
  </line>
  <line x1="437" y1="134" x2="560" y2="134" stroke="#59636E" stroke-width="3" stroke-linecap="round" opacity="0.28"/>

  <text x="42" y="170" fill="#59636E" font-size="14"
        font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace">Building scalable systems, intelligent backends,</text>
  <text x="42" y="190" fill="#59636E" font-size="14"
        font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace">and production-ready AI solutions.</text>

  <!-- animated terminal line -->
  <text x="42" y="224" fill="#B4690E" font-size="15" font-weight="700"
        font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace">$</text>
  <g mask="url(#mA)">
    <text x="62" y="224" fill="#1F2328" font-size="15"
          font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace">backend architecture &amp; system design</text>
  </g>
  <g mask="url(#mB)">
    <text x="62" y="224" fill="#1F2328" font-size="15"
          font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace">RAG pipelines · LLM agents · scalable APIs</text>
  </g>
  <rect x="62" y="210" width="9" height="18" fill="#B4690E">
    <animate attributeName="x"
             values="62;386;386;62;440;440;62"
             keyTimes="0;0.2308;0.4231;0.5;0.7308;0.9231;1"
             dur="13s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1"
             dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- ─────────── right column: desk motif ─────────── -->

  <ellipse cx="730" cy="122" rx="155" ry="98" fill="url(#glow)"/>

  <!-- monitor -->
  <rect x="616" y="52" width="228" height="138" rx="10" fill="#F6F8FA" stroke="#B4690E" stroke-width="2.5"/>
  <rect x="640" y="74"  width="150" height="6" rx="3" fill="#B4690E" opacity="0.32"/>
  <rect x="640" y="90"  width="96"  height="6" rx="3" fill="#B4690E" opacity="0.32"/>
  <rect x="640" y="106" width="132" height="6" rx="3" fill="#B4690E" opacity="0.32"/>
  <rect x="778" y="101" width="9" height="12" fill="#B4690E">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- desk -->
  <line x1="596" y1="214" x2="884" y2="214" stroke="#59636E" stroke-width="1.5" opacity="0.45" stroke-linecap="round"/>

  <!-- seated figure, from behind -->
  <g opacity="0.96">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -2.5; 0 0" dur="5s" repeatCount="indefinite" calcMode="spline"
                      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" keyTimes="0;0.5;1"/>
    <path d="M684 214 C684 179 703 165 730 165 C757 165 776 179 776 214 Z" fill="#1F2328"/>
    <!-- headphone band sits behind the head, so only a rim shows above the hair -->
    <path d="M699 146 A31 31 0 0 1 761 146" fill="none" stroke="#B4690E" stroke-width="5" stroke-linecap="round"/>
    <circle cx="730" cy="143" r="25" fill="#1F2328"/>
    <!-- hair: one mass, flared wider than the head, with soft spikes on top -->
    <path d="M702 150 C700 132 706 117 716 111 L712 100 L724 107 L729 96 L737 106 L748 99 L745 112 C756 118 760 133 758 150 C752 138 744 132 730 132 C716 132 708 138 702 150 Z" fill="#1F2328"/>
    <rect x="692" y="136" width="13" height="22" rx="6" fill="#B4690E"/>
    <rect x="755" y="136" width="13" height="22" rx="6" fill="#B4690E"/>
  </g>

  <!-- floating glyphs -->
  <text x="596" y="46" fill="#B4690E" opacity="0.45" font-size="13"
        font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace">{ }
    <animate attributeName="opacity" values="0.45;0.15;0.45" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="852" y="204" fill="#B4690E" opacity="0.45" font-size="13"
        font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace">&lt;/&gt;
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>
