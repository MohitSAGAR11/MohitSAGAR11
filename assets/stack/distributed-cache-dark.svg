<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 46" width="900" height="46" role="img" aria-label="Java · concurrency — Distributed_Cache: thread-safe distributed cache engine">
  <title>Java · concurrency — Distributed_Cache: thread-safe distributed cache engine</title>
  <style>
    text { font-family: ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace; }
    .in  { opacity: 0; animation: in .4s cubic-bezier(.2,.7,.2,1) both; }
    .pop { opacity: 0; animation: pop .3s cubic-bezier(.2,.7,.2,1) both; transform-box: fill-box; transform-origin: center; }
    @keyframes in  { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    @keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .in, .pop { animation: none; opacity: 1; } }
  </style>
  
  <text class="pop" style="animation-delay:1.05s" x="40" y="21" font-size="13.5" font-weight="700" fill="#F0B429">✓</text>
  <g class="in" style="animation-delay:0.35s">
    <text x="62" y="21" font-size="13.5" font-weight="700" fill="#E6EDF3">Java · concurrency</text>
    <text x="62" y="38" font-size="11" fill="#8B949E">thread-safe distributed cache engine</text>
  </g>
  <defs><mask id="dots" maskUnits="userSpaceOnUse"><rect x="221.79999999999998" y="13" width="0" height="8" fill="#fff">
    <animate attributeName="width" from="0" to="458.5" begin="0.5s" dur="0.5s" fill="freeze"/>
  </rect></mask></defs>
  <line mask="url(#dots)" x1="221.79999999999998" y1="17" x2="680.3" y2="17" stroke="#8B949E" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 7" opacity="0.7"/>
  <g class="in" style="animation-delay:0.90s">
    <text x="832" y="21" font-size="13.5" font-weight="700" text-anchor="end" fill="#F0B429">Distributed_Cache</text>
    <text x="840" y="21" font-size="13.5" fill="#8B949E">↗</text>
  </g>
</svg>
